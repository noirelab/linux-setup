[accessibility]
ui_scale = 1.20

[bar.default]
background_opacity = 0.35
border = "outline"
border_width = 0.0
center = ["workspaces","active_window"]
concave_edge_corners = false
end = ["media","noirelab/claude-usage:pinned","notifications","clock"]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.0
start = ["network","volume","tray"]
thickness = 30
padding = 16
shadow = false
font_weight = 500
    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g2"
    members = [ "noirelab/claude-usage:pinned" ]
    opacity = 1.0
    padding = 10.0

[shell]
corner_radius_scale = 1.6
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
font_family = "Inter"
    [shell.panel]
    transparency_mode = "glass"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    launcher_position = "top"
    launcher_placement = "floating"
    control_center_placement = "floating"
    [shell.shadow]
    alpha = 0.35

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"


[shell.launcher]
categories = false
show_app_origin_indicator = false
[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "on_surface"
format = "{:%H:%M   %a, %d %b}"
capsule = true
capsule_fill = "surface_variant"
[widget.launcher]
color = "secondary"

[widget.notepad]
type = "noirelab/notepad:notes"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "on_surface"
show_label = false

[widget.notifications]
color = "on_surface"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.spacer_g2a]
type = "spacer"
length = 8

[widget.spacer_g2b]
type = "spacer"
length = 8

[widget.spacer_g2c]
type = "spacer"
length = 8

[widget.spacer_g2d]
type = "spacer"
length = 8

[widget."noirelab/claude-usage:pinned"]
type = "noirelab/claude-usage:pinned"

[widget.temp]

[widget.sysmon_2]
glyph = "gpu-usage"
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = false
capsule_fill = "on_secondary"

[widget.volume]
color = "on_surface"
show_label = false

[widget.workspaces]
active_pill_size = 2.5
capsule = false
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

[notification]
position = "top_right"
offset_x = 14
offset_y = 12
background_opacity = 0.78
border = true

[dock]
enabled = true
position = "bottom"
active_monitor_only = true
pinned = ["nemo","firefox","kitty","code","obsidian","spotify","discord"]
icon_size = 40
item_spacing = 8
main_axis_padding = 12
cross_axis_padding = 8
background_opacity = 0.55
radius = 20
border = "outline"
border_width = 0.5
concave_edge_corners = false
margin_edge = 12
smart_auto_hide = true
reserve_space = false
magnification = false
inactive_scale = 1.0
inactive_opacity = 1.0
show_dots = true
show_instance_count = false

[lockscreen]
blurred_desktop = true
blur_intensity = 0.7
tint_intensity = 0.35
[osd]
background_opacity = 0.7