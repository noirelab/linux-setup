[lockscreen_widgets.widget."lockscreen-clock@HDMI-A-1"]
type = "clock"
output = "HDMI-A-1"
cx = 540.0
cy = 576.0
box_width = 620.0
box_height = 200.0
rotation = 0.0
placement_width = 1080.0
placement_height = 1920.0

[lockscreen_widgets.widget."lockscreen-clock@HDMI-A-1".settings]
clock_style = "digital"
format = "{:%H:%M}"
center_text = true
color = "#f2f2f5"
font_family = "Inter Thin"
shadow = false
background_opacity = 0.0

[lockscreen_widgets.widget."lockscreen-date@HDMI-A-1"]
type = "clock"
output = "HDMI-A-1"
cx = 540.0
cy = 711.0
box_width = 420.0
box_height = 44.0
rotation = 0.0
placement_width = 1080.0
placement_height = 1920.0

[lockscreen_widgets.widget."lockscreen-date@HDMI-A-1".settings]
clock_style = "digital"
format = "{:%A, %d de %B}"
center_text = true
color = "#c9cbd3"
font_family = "Inter"
shadow = false
background_opacity = 0.0

[control_center]
sidebar = "none"
sidebar_section = "compact"
show_shortcut_labels = true
show_session_button = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "power_profile"
