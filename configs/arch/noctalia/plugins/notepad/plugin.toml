# Notepad — sticky notes panel. Click the bar icon to open a menu of
# sticky notes: create, edit, recolor and delete notes that persist
# across restarts.

id = "noirelab/notepad"
name = "Notepad"
version = "1.0.0"
plugin_api = 21
author = "noirelab"
license = "MIT"
icon = "notes"
tags = ["notes", "productivity"]
description = "Sticky notes menu opened from the bar. Create, edit, recolor and delete notes that persist across restarts."

[[setting]]
key = "seed_vimium"
type = "bool"
label_key = "settings.seed_vimium.label"
description_key = "settings.seed_vimium.description"
default = true

[[widget]]
id = "notes"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 560
placement = "floating"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
keyboard_focus = "on_demand"
