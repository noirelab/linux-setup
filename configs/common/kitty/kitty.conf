
background_blur             30
cursor_trail                1
window_padding_width        25

include themes/noctalia.conf
# claude-preview opens its split through this socket; socket-only plus a
# per-user dir keeps other processes and users from driving kitty
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
focus_follows_mouse yes
scrollback_lines 20000

background_opacity      0.62

# Nava OS terminal: deep navy slate instead of the palette's near-black
background              #161a27
