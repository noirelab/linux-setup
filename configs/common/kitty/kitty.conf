
background_blur             30
cursor_trail                1
window_padding_width        25

include themes/noctalia.conf
allow_remote_control yes
scrollback_lines 20000

# Nava-style window label: the window title sits at the top, quiet and left-aligned
tab_bar_edge            top
tab_bar_min_tabs        1
tab_bar_style           separator
tab_separator           "   "
tab_title_template      "     {title}"
tab_bar_margin_height   10.0 0.0
tab_bar_margin_width    0.0
active_tab_font_style   normal
inactive_tab_font_style normal
active_tab_foreground   #a3a3ab
active_tab_background   #0b0b0d
inactive_tab_foreground #5c5f6b
inactive_tab_background #0b0b0d
background_opacity      0.72
